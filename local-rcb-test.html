<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local RCB Player Stats Test</title>
    <link rel="stylesheet" href="css/admin-live-match-modern.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .player-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 32px; }
        .player-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 16px; width: 180px; cursor: pointer; transition: box-shadow 0.2s; }
        .player-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 1000; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); padding: 32px; z-index: 1001; min-width: 320px; }
        .modal-close { position: absolute; top: 12px; right: 16px; font-size: 22px; cursor: pointer; }
        .modal-content { margin-top: 24px; }
    </style>
</head>
<body>
    <h2 style="text-align:center; margin-top:32px;">RCB Player Stats (Local Test)</h2>
    <div style="text-align:center; margin-bottom:24px;">
        <span id="totalPlayers" style="margin-right:24px;"></span>
        <span id="batsmenCount" style="margin-right:24px;"></span>
        <span id="bowlersCount" style="margin-right:24px;"></span>
        <span id="allRoundersCount" style="margin-right:24px;"></span>
        <span id="wicketKeepersCount"></span>
    </div>
    <div class="player-grid" id="playerGrid"></div>
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal" id="playerModal">
        <span class="modal-close" id="modalClose">&times;</span>
        <h3 id="modalPlayerName"></h3>
        <div class="modal-content" id="modalPlayerStats"></div>
    </div>
    <script>
    // Sample local player data for testing
    const localPlayers = [
        { name: "Virat Kohli", runs: 973, matches: 16, average: 81.08, strikeRate: 152.03 },
        { name: "AB de Villiers", runs: 687, matches: 14, average: 57.25, strikeRate: 168.74 },
        { name: "Chris Gayle", runs: 733, matches: 15, average: 52.35, strikeRate: 160.74 },
        { name: "Yuzvendra Chahal", wickets: 21, matches: 16, economy: 7.08 },
        { name: "KL Rahul", runs: 593, matches: 14, average: 42.35, strikeRate: 135.38 }
    ];

    function displayPlayers(players) {
        const grid = document.getElementById('playerGrid');
        grid.innerHTML = '';
        players.forEach((player, idx) => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `<strong>${player.name}</strong><br>
                ${player.runs ? `Runs: ${player.runs}<br>` : ''}
                ${player.wickets ? `Wickets: ${player.wickets}<br>` : ''}
                Matches: ${player.matches}`;
            card.onclick = () => showPlayerModal(player);
            grid.appendChild(card);
        });

        // Stats summary
        const totalPlayers = players.length;
        const batsmen = players.filter(p => (p.role || '').toLowerCase() === 'batsman').length;
        const bowlers = players.filter(p => (p.role || '').toLowerCase() === 'bowler').length;
        const allRounders = players.filter(p => (p.role || '').toLowerCase() === 'all-rounder').length;
        const wicketKeepers = players.filter(p => (p.role || '').toLowerCase() === 'wicket-keeper').length;

        document.getElementById('totalPlayers').textContent = `Total Players: ${totalPlayers}`;
        document.getElementById('batsmenCount').textContent = `Batsmen: ${batsmen}`;
        document.getElementById('bowlersCount').textContent = `Bowlers: ${bowlers}`;
        document.getElementById('allRoundersCount').textContent = `All-Rounders: ${allRounders}`;
        document.getElementById('wicketKeepersCount').textContent = `Wicket-Keepers: ${wicketKeepers}`;
    }

    function showPlayerModal(player) {
        document.getElementById('modalPlayerName').textContent = player.name;
        let statsHtml = '';
        if (player.runs) {
            statsHtml += `<b>Runs:</b> ${player.runs}<br>`;
            statsHtml += `<b>Average:</b> ${player.average}<br>`;
            statsHtml += `<b>Strike Rate:</b> ${player.strikeRate}<br>`;
        }
        if (player.wickets) {
            statsHtml += `<b>Wickets:</b> ${player.wickets}<br>`;
            statsHtml += `<b>Economy:</b> ${player.economy}<br>`;
        }
        statsHtml += `<b>Matches:</b> ${player.matches}`;
        document.getElementById('modalPlayerStats').innerHTML = statsHtml;
        document.getElementById('modalBg').style.display = 'block';
        document.getElementById('playerModal').style.display = 'block';
    }

    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').onclick = closeModal;
    function closeModal() {
        document.getElementById('modalBg').style.display = 'none';
        document.getElementById('playerModal').style.display = 'none';
    }

    // Initialize
    displayPlayers(localPlayers);
    </script>
</body>
</html>
