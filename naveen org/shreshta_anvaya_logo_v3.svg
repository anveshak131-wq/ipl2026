<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F1C40F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGradient)" opacity="0.05"/>
  <circle cx="160" cy="160" r="145" fill="none" stroke="url(#bgGradient)" stroke-width="2"/>
  
  <!-- Main symbol group -->
  <g transform="translate(160, 160)">
    
    <!-- Single continuous stroke design: Flame with human form -->
    <path d="M 0,40 
             C -8,40 -12,35 -12,30
             L -12,25
             C -12,20 -10,15 -8,10
             C -6,5 -4,0 -3,-5
             C -2,-10 -1,-15 0,-20
             C 1,-15 2,-10 3,-5
             C 4,0 6,5 8,10
             C 10,15 12,20 12,25
             L 12,30
             C 12,35 8,40 0,40
             Z
             M -3,-5
             C -4,-3 -5,-1 -5,2
             C -5,5 -3,7 0,7
             C 3,7 5,5 5,2
             C 5,-1 4,-3 3,-5
             C 2,-7 1,-8 0,-8
             C -1,-8 -2,-7 -3,-5
             Z
             M 0,-20
             C -2,-22 -5,-24 -8,-25
             C -10,-26 -12,-26 -14,-25
             C -16,-24 -17,-22 -16,-20
             C -15,-18 -12,-17 -8,-18
             C -4,-19 -1,-19 0,-20
             C 1,-19 4,-19 8,-18
             C 12,-17 15,-18 16,-20
             C 17,-22 16,-24 14,-25
             C 12,-26 10,-26 8,-25
             C 5,-24 2,-22 0,-20
             Z" 
          fill="url(#flameGradient)" opacity="0.9"/>
    
    <!-- Human form subtle details within flame -->
    <g opacity="0.3">
      <!-- Head -->
      <circle cx="0" cy="-18" r="2" fill="#E74C3C"/>
      <!-- Body -->
      <rect x="-1" y="-15" width="2" height="8" fill="#F39C12"/>
      <!-- Arms (upward reaching) -->
      <path d="M -1,-13 L -3,-15 M 1,-13 L 3,-15" 
            stroke="#F39C12" stroke-width="1" stroke-linecap="round"/>
    </g>
    
    <!-- Foundation base bar -->
    <rect x="-25" y="45" width="50" height="4" rx="2" fill="url(#baseGradient)"/>
    
    <!-- Subtle stability lines -->
    <path d="M -20,49 L -15,52 M 20,49 L 15,52" 
          stroke="#2C3E50" stroke-width="1" opacity="0.4"/>
    
    <!-- Decorative elements representing knowledge and growth -->
    <g opacity="0.2">
      <circle cx="-18" cy="-8" r="1" fill="#F39C12"/>
      <circle cx="18" cy="-8" r="1" fill="#F39C12"/>
      <circle cx="-12" cy="5" r="1" fill="#27AE60"/>
      <circle cx="12" cy="5" r="1" fill="#27AE60"/>
    </g>
  </g>
  
  <!-- Organization Name -->
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="300" 
        text-anchor="middle" fill="#2C3E50" letter-spacing="1">SHRESHTA ANVAYA</text>
  <text x="160" y="248" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#34495E" letter-spacing="0.5">CHARITABLE TRUST</text>
  
  <!-- Minimal decorative elements -->
  <g transform="translate(160, 270)">
    <line x1="-20" y1="0" x2="-10" y2="0" stroke="#FF6B35" stroke-width="0.5" opacity="0.4"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#FF6B35" stroke-width="0.5" opacity="0.5"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#FF6B35" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- Subtle upward energy lines -->
  <g transform="translate(160, 85)" opacity="0.15">
    <path d="M -10,0 L -5,-3 M 0,0 L 0,-3 M 10,0 L 5,-3" 
          stroke="#F39C12" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
