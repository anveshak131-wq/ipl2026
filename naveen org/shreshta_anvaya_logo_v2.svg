<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sproutGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunriseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F1C40F;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGradient)" opacity="0.05"/>
  <circle cx="160" cy="160" r="145" fill="none" stroke="url(#bgGradient)" stroke-width="2"/>
  
  <!-- Sunrise arc background (hopeful future) -->
  <path d="M 80,180 Q 160,120 240,180" 
        fill="url(#sunriseGradient)" opacity="0.6"/>
  
  <!-- Main symbol group -->
  <g transform="translate(160, 160)">
    
    <!-- Left hand (abstract, softly shaped) -->
    <path d="M -45,25 Q -50,15 -45,5 Q -35,-5 -25,-5 Q -20,0 -15,5 Q -10,10 -5,15 Q -8,20 -12,25 Q -20,30 -30,28 Q -40,25 -45,25" 
          fill="url(#handsGradient)" opacity="0.8"/>
    
    <!-- Right hand (abstract, softly shaped) -->
    <path d="M 45,25 Q 50,15 45,5 Q 35,-5 25,-5 Q 20,0 15,5 Q 10,10 5,15 Q 8,20 12,25 Q 20,30 30,28 Q 40,25 45,25" 
          fill="url(#handsGradient)" opacity="0.8"/>
    
    <!-- Central seed/soil foundation -->
    <ellipse cx="0" cy="15" rx="8" ry="6" fill="#8B4513" opacity="0.7"/>
    <ellipse cx="0" cy="13" rx="6" ry="4" fill="#A0522D"/>
    
    <!-- Sprouting stem with gentle arc (smiling shape) -->
    <path d="M 0,10 Q -3,5 -2,0 Q -1,-5 0,-10 Q 1,-15 0,-20" 
          stroke="url(#sproutGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Two leaves -->
    <!-- Left leaf -->
    <path d="M 0,-20 Q -8,-22 -12,-18 Q -10,-15 -5,-16 Q -2,-18 0,-20" 
          fill="url(#sproutGradient)" opacity="0.9"/>
    
    <!-- Right leaf -->
    <path d="M 0,-20 Q 8,-22 12,-18 Q 10,-15 5,-16 Q 2,-18 0,-20" 
          fill="url(#sproutGradient)" opacity="0.9"/>
    
    <!-- Small detail lines on leaves -->
    <path d="M -2,-19 Q -6,-19 -8,-17" 
          stroke="#27AE60" stroke-width="0.5" fill="none" opacity="0.7"/>
    <path d="M 2,-19 Q 6,-19 8,-17" 
          stroke="#27AE60" stroke-width="0.5" fill="none" opacity="0.7"/>
    
    <!-- Connecting elements between hands and sprout (nurturing support) -->
    <path d="M -15,15 Q -10,12 -5,10" 
          stroke="#FF6B35" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 15,15 Q 10,12 5,10" 
          stroke="#FF6B35" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Organization Name -->
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        text-anchor="middle" fill="#2C3E50">SHRESHTA ANVAYA</text>
  <text x="160" y="250" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#34495E">CHARITABLE TRUST</text>
  
  <!-- Decorative dots representing community/growth -->
  <g transform="translate(160, 275)">
    <circle cx="-25" cy="0" r="1.5" fill="#FF6B35" opacity="0.4"/>
    <circle cx="-12" cy="0" r="1.5" fill="#FF6B35" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#FF6B35" opacity="0.6"/>
    <circle cx="12" cy="0" r="1.5" fill="#FF6B35" opacity="0.5"/>
    <circle cx="25" cy="0" r="1.5" fill="#FF6B35" opacity="0.4"/>
  </g>
  
  <!-- Subtle growth indicators -->
  <g transform="translate(160, 90)" opacity="0.2">
    <path d="M -15,0 Q -7,-3 0,0 Q 7,-3 15,0" 
          stroke="#27AE60" stroke-width="1" fill="none"/>
  </g>
</svg>
