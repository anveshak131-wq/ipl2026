<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGradient)" opacity="0.1"/>
  <circle cx="160" cy="160" r="145" fill="none" stroke="url(#bgGradient)" stroke-width="2"/>
  
  <!-- Central symbol - Combining elements representing Shrestha (excellence) and Anvaya (connection) -->
  <g transform="translate(160, 140)">
    <!-- Lotus petals representing excellence/growth (Shreshta) -->
    <path d="M 0,-40 Q -15,-35 -20,-20 Q -15,-5 0,0 Q 15,-5 20,-20 Q 15,-35 0,-40" 
          fill="url(#symbolGradient)" opacity="0.8"/>
    <path d="M 0,-40 Q 15,-35 20,-20 Q 15,-5 0,0 Q -15,-5 -20,-20 Q -15,-35 0,-40" 
          fill="url(#symbolGradient)" opacity="0.6"/>
    <path d="M -40,0 Q -35,-15 -20,-20 Q -5,-15 0,0 Q -5,15 -20,20 Q -35,15 -40,0" 
          fill="url(#symbolGradient)" opacity="0.7"/>
    <path d="M 40,0 Q 35,-15 20,-20 Q 5,-15 0,0 Q 5,15 20,20 Q 35,15 40,0" 
          fill="url(#symbolGradient)" opacity="0.7"/>
    
    <!-- Central circle representing unity/community (Anvaya) -->
    <circle cx="0" cy="0" r="12" fill="#FF6B35"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    
    <!-- Connecting lines representing network/connection -->
    <path d="M 0,-12 L 0,-35" stroke="#FF6B35" stroke-width="2" opacity="0.8"/>
    <path d="M 12,0 L 35,0" stroke="#FF6B35" stroke-width="2" opacity="0.8"/>
    <path d="M 0,12 L 0,35" stroke="#FF6B35" stroke-width="2" opacity="0.8"/>
    <path d="M -12,0 L -35,0" stroke="#FF6B35" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Organization Name -->
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        text-anchor="middle" fill="#2C3E50">SHRESHTA ANVAYA</text>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="12" 
        text-anchor="middle" fill="#34495E">CHARITABLE TRUST</text>
  
  <!-- Decorative elements -->
  <g transform="translate(160, 260)">
    <circle cx="-30" cy="0" r="2" fill="#FF6B35" opacity="0.6"/>
    <circle cx="-15" cy="0" r="2" fill="#FF6B35" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#FF6B35" opacity="0.8"/>
    <circle cx="15" cy="0" r="2" fill="#FF6B35" opacity="0.7"/>
    <circle cx="30" cy="0" r="2" fill="#FF6B35" opacity="0.6"/>
  </g>
  
  <!-- Subtle traditional Indian pattern elements -->
  <g transform="translate(160, 85)" opacity="0.3">
    <path d="M -20,0 Q -10,-5 0,0 Q 10,-5 20,0" 
          stroke="#2C3E50" stroke-width="1" fill="none"/>
    <path d="M -20,5 Q -10,0 0,5 Q 10,0 20,5" 
          stroke="#2C3E50" stroke-width="1" fill="none"/>
  </g>
</svg>
