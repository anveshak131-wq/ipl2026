<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Challengers Bangalore - IPL Cricket Hub</title>
    <link rel="shortcut icon" href="assets/ipl_logo_new.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared-modern.css">
    <link rel="stylesheet" href="css/team-styles.css">
    <style>
    .blurred {
        filter: blur(8px) brightness(0.7);
        transition: filter 0.3s;
        pointer-events: none;
    }
    .player-modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(10,14,39,0.85);
        z-index: 9999;
        backdrop-filter: blur(4px);
        animation: fadeIn 0.3s;
    }
    .player-modal {
        display: none;
    }
    .player-modal-content {
        background: rgba(16, 20, 48, 0.95);
        border-radius: 20px;
        padding: 2rem;
        max-width: 800px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
    }
    .modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 2rem;
        cursor: pointer;
        padding: 0.5rem;
        line-height: 1;
        transition: color 0.2s;
    }
    .modal-close:hover {
        color: #fff;
    }
    .modal-player-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .modal-player-logo {
        width: 100px;
        height: 100px;
        margin: 0 auto 1rem;
    }
    .modal-player-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .modal-player-name {
        font-size: 2.5rem;
        color: #fff;
        margin: 0.5rem 0;
        font-family: 'Bebas Neue', sans-serif;
    }
    .modal-player-role {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }
    .modal-player-badges {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
    }
    .modal-badge {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.9);
    }
    .player-details-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2rem;
    }
    .details-section h4 {
        color: #FFD700;
        margin-bottom: 1rem;
        font-size: 1.2rem;
        text-transform: uppercase;
    }
    .detail-item {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .detail-label {
        color: rgba(255, 255, 255, 0.7);
    }
    .detail-value {
        color: #fff;
        font-weight: 500;
    }
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 1rem;
    }
    .stat-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 1rem;
        border-radius: 10px;
        text-align: center;
    }
    .stat-number {
        font-size: 1.5rem;
        color: #fff;
        font-weight: 600;
        margin-bottom: 0.3rem;
    }
    .stat-label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
    }
    .empty-state {
        text-align: center;
        padding: 2rem;
        color: rgba(255, 255, 255, 0.7);
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    </style>
</head>
<body data-team="RCB">
    <!-- Animated Mesh Background -->
    <div class="mesh-background">
        <div class="mesh-gradient mesh-gradient-1"></div>
        <div class="mesh-gradient mesh-gradient-2"></div>
        <div class="mesh-gradient mesh-gradient-3"></div>
        <div class="mesh-gradient mesh-gradient-4"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/ipl_logo_new.svg" alt="IPL Logo">
                <span>IPL Cricket Hub</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#teams">Teams</a></li>
                <li><a href="fixtures_modern.html">Fixtures</a></li>
                <li><a href="points_modern.html">Points</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Team Header -->
    <section class="team-header">
        <div class="team-header-container">
            <div class="team-logo-hero">
                <img src="assets/rcb_logo_new.svg" alt="ROYAL CHALLENGERS BANGALORE">
            </div>
            <h1 class="team-title">ROYAL CHALLENGERS BANGALORE</h1>
            <p class="team-subtitle">Bengaluru</p>
            <div class="team-stats-bar">
                <div class="team-stat">
                    <div class="team-stat-number" id="playerCount">0</div>
                    <div class="team-stat-label">Players</div>
                </div>
                <div class="team-stat">
                    <div class="team-stat-number" id="foreignCount">0</div>
                    <div class="team-stat-label">Overseas</div>
                </div>
                <div class="team-stat">
                    <div class="team-stat-number" id="indianCount">0</div>
                    <div class="team-stat-label">Indian</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Squad Section -->
    <section class="squad-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">SQUAD 2026</h2>
                <p class="section-subtitle">Meet our powerhouse lineup</p>
            </div>
            <div class="players-grid" id="playersContainer">
                <!-- Players will be loaded dynamically from localStorage -->
            </div>
        </div>
    </section>

    <!-- Player Details Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-modal-content">
            <button class="modal-close" onclick="closePlayerModal()">&times;</button>
            <div class="modal-player-header">
                <div class="modal-player-logo">
                    <img src="assets/rcb_logo_new.svg" alt="Player" id="modalPlayerLogo">
                </div>
                <h2 class="modal-player-name" id="modalPlayerName">Player Name</h2>
                <p class="modal-player-role" id="modalPlayerRole">Role</p>
                <div class="modal-player-badges" id="modalPlayerBadges">
                    <!-- Badges will be added dynamically -->
                </div>
            </div>
            <div class="modal-player-details" id="modalPlayerDetails">
                <!-- Details will be added dynamically -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 SportsUP99. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/team-page-loader.js?v=2.1"></script>
    <script>
    // Scroll effect
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Make showPlayerModal function available globally
    window.showPlayerModal = function(player) {
        const modal = document.getElementById('playerModal');
        const modalName = document.getElementById('modalPlayerName');
        const modalRole = document.getElementById('modalPlayerRole');
        const modalBadges = document.getElementById('modalPlayerBadges');
        const modalStats = document.getElementById('modalPlayerStats');
        const modalDetails = document.getElementById('modalPlayerDetails');

        // Set basic info
        modalName.textContent = player.name || 'Unknown Player';
        modalRole.textContent = player.role || 'Player';

    window.showPlayerModal = showPlayerModal;
        // Set badges
        let badgesHTML = '';
        if (player.isCaptain) badgesHTML += '<span class="modal-badge badge-captain">👑 Captain</span>';
        if (player.isViceCaptain) badgesHTML += '<span class="modal-badge badge-captain">⭐ Vice Captain</span>';
        if (player.isForeign) badgesHTML += '<span class="modal-badge badge-foreign">🌏 Overseas</span>';
        if ((player.role || '').toLowerCase() === 'wicket-keeper') badgesHTML += '<span class="modal-badge badge-wk">🧤 Wicket-Keeper</span>';
        modalBadges.innerHTML = badgesHTML;

        // Hide modalStats element if it exists (use details for all stats now)
        if (modalStats) modalStats.innerHTML = '';

        // Set detailed information with comprehensive statistics
        const allrounderType = player['allrounder type'] || player['Allrounder Type'] || '';
        const stats = player.stats || {};
        let detailsHTML = '';
        if (Object.keys(stats).length > 0) {
            detailsHTML = `
                <div class="player-details-grid">
                    <div class="details-section">
                        <h4>Player Information</h4>
                        ${player.age ? `<div class="detail-item"><div class="detail-label">Age</div><div class="detail-value">${player.age}</div></div>` : ''}
                        ${player.nationality ? `<div class="detail-item"><div class="detail-label">Nationality</div><div class="detail-value">${player.nationality}</div></div>` : ''}
                        ${player.jersey ? `<div class="detail-item"><div class="detail-label">Jersey Number</div><div class="detail-value">${player.jersey}</div></div>` : ''}
                        ${player['batting style'] || player.Batting ? `<div class="detail-item"><div class="detail-label">Batting Style</div><div class="detail-value">${player['batting style'] || player.Batting}</div></div>` : ''}
                        ${player['bowling style'] || player.Bowling ? `<div class="detail-item"><div class="detail-label">Bowling Style</div><div class="detail-value">${player['bowling style'] || player.Bowling}</div></div>` : ''}
                        ${allrounderType ? `<div class="detail-item"><div class="detail-label">All-Rounder Type</div><div class="detail-value">${allrounderType}</div></div>` : ''}
                    </div>
                    <div class="details-section">
                        <h4>Batting Statistics</h4>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-number">${stats.matches || 0}</div><div class="stat-label">Matches</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.runs || 0}</div><div class="stat-label">Runs</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.battingAvg || '0.00'}</div><div class="stat-label">Average</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.strikeRate || '0.00'}</div><div class="stat-label">Strike Rate</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.highestScore || 0}</div><div class="stat-label">Highest Score</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.centuries || 0}</div><div class="stat-label">Centuries</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.fifties || 0}</div><div class="stat-label">Half-Centuries</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.sixes || 0}</div><div class="stat-label">Sixes</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.fours || 0}</div><div class="stat-label">Fours</div></div>
                        </div>
                    </div>
                    <div class="details-section">
                        <h4>Bowling Statistics</h4>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-number">${stats.wickets || 0}</div><div class="stat-label">Wickets</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.bowlingAvg || '0.00'}</div><div class="stat-label">Bowling Average</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.economy || '0.00'}</div><div class="stat-label">Economy Rate</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.bestBowling || '-'}</div><div class="stat-label">Best Bowling</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.fiveWickets || 0}</div><div class="stat-label">5-Wicket Hauls</div></div>
                            <div class="stat-item"><div class="stat-number">${stats.fourWickets || 0}</div><div class="stat-label">4-Wicket Hauls</div></div>
                        </div>
                    </div>
                </div>
            `;
        } else {
            detailsHTML = `<div class='empty-state'><h4>No stats available for this player.</h4></div>`;
        }
        modalDetails.innerHTML = detailsHTML;

    // Show modal and blur main content
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    document.querySelector('.container').classList.add('blurred');
    document.querySelector('.team-header').classList.add('blurred');
    }

    function closePlayerModal() {
        const modal = document.getElementById('playerModal');
    modal.classList.remove('active');
    document.body.style.overflow = 'auto';
    document.querySelector('.container').classList.remove('blurred');
    document.querySelector('.team-header').classList.remove('blurred');
    }

    // Close modal on background click
    document.getElementById('playerModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closePlayerModal();
        }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePlayerModal();
        }
    });

    // Display all players sorted by role and age in console
    function displayAllPlayersByAge() {
        const TEAM_OPTIONS = ['RCB', 'MI', 'CSK', 'SRH', 'PBSK', 'KKR', 'DC', 'RR', 'GT', 'LSG'];
        const allPlayers = [];
        
        TEAM_OPTIONS.forEach(team => {
            const key = `uploaded_${team.toLowerCase()}_players`;
            try {
                const players = JSON.parse(localStorage.getItem(key) || '[]');
                players.forEach(player => {
                    allPlayers.push({ ...player, team: team });
                });
            } catch(e) {}
        });
        
        if (allPlayers.length === 0) {
            console.log('%cNo players found in localStorage', 'color: #EF4444; font-size: 16px; font-weight: bold;');
            return;
        }
        
        const roleOrder = { 'batsman': 1, 'wicket-keeper': 2, 'all-rounder': 3, 'bowler': 4 };
        allPlayers.sort((a, b) => {
            const orderA = roleOrder[(a.role || '').toLowerCase()] || 99;
            const orderB = roleOrder[(b.role || '').toLowerCase()] || 99;
            if (orderA !== orderB) return orderA - orderB;
            return parseInt(b.age || 0) - parseInt(a.age || 0);
        });
        
        console.log('%c═══════════════════════════════════════════════════', 'color: #FFD700; font-weight: bold;');
        console.log('%c🏏 ALL IPL PLAYERS - SORTED BY ROLE & AGE', 'color: #00D9FF; font-size: 20px; font-weight: bold;');
        console.log('%c═══════════════════════════════════════════════════', 'color: #FFD700; font-weight: bold;');
        console.log(`%cTotal Players: ${allPlayers.length}`, 'color: #10B981; font-size: 14px; font-weight: bold;');
        console.log('');
        
        let currentRole = '';
        let roleCount = 0;
        const roleEmoji = { 'BATSMAN': '🏏', 'WICKET-KEEPER': '🧤', 'ALL-ROUNDER': '⚡', 'BOWLER': '🎯' };
        
        allPlayers.forEach(player => {
            const role = (player.role || 'Unknown').toUpperCase();
            if (role !== currentRole) {
                if (roleCount > 0) {
                    console.log(`%c   └─ Total: ${roleCount} players`, 'color: #A1A1AA; font-style: italic;');
                    console.log('');
                }
                currentRole = role;
                roleCount = 0;
                console.log(`%c${roleEmoji[role] || '👤'} ${role}S`, 'color: #FF4655; font-size: 16px; font-weight: bold; text-decoration: underline;');
                console.log('%c───────────────────────────────────────────────────', 'color: #4B5563;');
            }
            roleCount++;
            
            const badges = [];
            if (player.isCaptain) badges.push('👑 Captain');
            if (player.isViceCaptain) badges.push('⭐ Vice-Captain');
            if (player.isForeign) badges.push('🌏 Foreign');
            const badgeText = badges.length > 0 ? ` [${badges.join(', ')}]` : '';
            
            console.log(
                `%c   ${roleCount}. ${player.name || 'Unknown'}%c | Age: %c${player.age || 'N/A'}%c | Team: %c${player.team || 'N/A'}%c | ${player.nationality || 'Unknown'}${badgeText}`,
                'color: #E4E4E7; font-weight: bold;',
                'color: #A1A1AA;',
                'color: #FFD700; font-weight: bold;',
                'color: #A1A1AA;',
                'color: #00D9FF; font-weight: bold;',
                'color: #A1A1AA;'
            );
            
            if (player['batting style'] || player['bowling style']) {
                console.log(`%c      ↳ Batting: ${player['batting style'] || 'N/A'} | Bowling: ${player['bowling style'] || 'N/A'}`, 'color: #6B7280; font-size: 11px;');
            }
            if (player['allrounder type']) {
                console.log(`%c      ↳ Type: ${player['allrounder type']}`, 'color: #10B981; font-size: 11px;');
            }
        });
        
        if (roleCount > 0) {
            console.log(`%c   └─ Total: ${roleCount} players`, 'color: #A1A1AA; font-style: italic;');
        }
        
        console.log('');
        console.log('%c═══════════════════════════════════════════════════', 'color: #FFD700; font-weight: bold;');
        console.log('%c✅ Complete player list displayed above', 'color: #10B981; font-size: 14px; font-weight: bold;');
        console.log('%c═══════════════════════════════════════════════════', 'color: #FFD700; font-weight: bold;');
    }

    // Auto-display all players on load
    setTimeout(() => displayAllPlayersByAge(), 1000);
    console.log('%cType displayAllPlayersByAge() to view all players sorted by role & age', 'color: #FFD700; font-size: 12px;');
    </script>
</body>
</html>
