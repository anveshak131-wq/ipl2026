<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCB Squad 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ipl2020/css/shared-modern.css">
    <link rel="stylesheet" href="ipl2020/css/team-styles.css">
    <style>
        .blurred{filter:blur(8px);pointer-events:none}
        .player-modal{display:none}
        .player-modal.active{display:flex;align-items:center;justify-content:center;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,14,39,0.9);z-index:9999}
        .player-modal-content{background:rgba(16,20,48,0.98);border-radius:24px;padding:2.5rem;max-width:900px;width:90%;max-height:90vh;overflow-y:auto;border:2px solid rgba(255,70,85,0.3);position:relative}
        .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer}
        .modal-player-header{text-align:center;margin-bottom:2rem}
        .modal-player-logo{width:100px;height:100px;margin:0 auto 1rem}
        .modal-player-logo img{width:100%;height:100%;object-fit:contain}
        .modal-player-name{font-size:2.5rem;color:#fff;margin:0.5rem 0;font-family:"Bebas Neue",sans-serif}
        .modal-player-role{color:rgba(255,255,255,0.7);font-size:1.2rem;margin-bottom:1rem}
        .modal-player-badges{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
        .modal-badge{background:rgba(255,255,255,0.1);padding:0.3rem 0.8rem;border-radius:50px;font-size:0.9rem;color:#fff}
        .player-details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}
        .details-section{background:rgba(255,255,255,0.03);padding:1.5rem;border-radius:15px;border:1px solid rgba(255,255,255,0.1)}
        .details-section h4{color:#FFD700;margin-bottom:1rem;font-size:1.2rem;text-transform:uppercase}
        .detail-item{display:flex;justify-content:space-between;padding:0.75rem 0;border-bottom:1px solid rgba(255,255,255,0.08)}
        .detail-item:last-child{border-bottom:none}
        .detail-label{color:rgba(255,255,255,0.7);font-size:0.95rem}
        .detail-value{color:#fff;font-weight:600}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem}
        .stat-item{background:rgba(255,255,255,0.08);padding:1.2rem 1rem;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
        .stat-number{font-size:1.8rem;color:#00D9FF;font-weight:700;margin-bottom:0.5rem}
        .stat-label{color:rgba(255,255,255,0.8);font-size:0.85rem;text-transform:uppercase}
        .empty-state{text-align:center;padding:3rem 2rem;color:rgba(255,255,255,0.7)}
    </style>
</head>
<body data-team="RCB">
    <section class="team-header">
        <div class="team-header-container">
            <div class="team-logo-hero"><img src="ipl2020/assets/rcb_logo_new.svg" alt="RCB"></div>
            <h1 class="team-title">ROYAL CHALLENGERS BANGALORE</h1>
            <p class="team-subtitle">Bengaluru</p>
            <div class="team-stats-bar">
                <div class="team-stat"><div class="team-stat-number" id="playerCount">0</div><div class="team-stat-label">Players</div></div>
                <div class="team-stat"><div class="team-stat-number" id="foreignCount">0</div><div class="team-stat-label">Overseas</div></div>
                <div class="team-stat"><div class="team-stat-number" id="indianCount">0</div><div class="team-stat-label">Indian</div></div>
            </div>
        </div>
    </section>
    <section class="squad-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">SQUAD 2026</h2>
                <p class="section-subtitle">Meet our powerhouse lineup</p>
            </div>
            <div class="players-grid" id="playersContainer"></div>
        </div>
    </section>
    <div class="player-modal" id="playerModal">
        <div class="player-modal-content">
            <button class="modal-close" id="modalCloseButton">&times;</button>
            <div class="modal-player-header">
                <div class="modal-player-logo"><img src="ipl2020/assets/rcb_logo_new.svg" id="modalPlayerLogo"></div>
                <h2 class="modal-player-name" id="modalPlayerName"></h2>
                <p class="modal-player-role" id="modalPlayerRole"></p>
                <div class="modal-player-badges" id="modalPlayerBadges"></div>
            </div>
            <div class="modal-player-details" id="modalPlayerDetails"></div>
        </div>
    </div>
    <footer><div class="footer-content"><p>&copy; 2026 SportsUP99</p></div></footer>
    <script>
    console.log('✅ BRAND NEW FILE - NEVER CACHED BEFORE!');
    const L={'RCB':'ipl2020/assets/rcb_logo_new.svg'};
    function showModal(p){const m=document.getElementById('playerModal'),d=document.getElementById('modalPlayerDetails');if(!m||!d){alert('Modal error');return}document.getElementById('modalPlayerName').textContent=p.name||'Unknown';document.getElementById('modalPlayerRole').textContent=(p.role||'Player')+(p.team?' • '+p.team:'');document.getElementById('modalPlayerLogo').src=L[p.team]||'ipl2020/assets/ipl_logo_new.svg';let b='';if(p.isCaptain)b+='<span class="modal-badge">👑 Captain</span>';if(p.isViceCaptain)b+='<span class="modal-badge">⭐ VC</span>';if(p.isForeign)b+='<span class="modal-badge">🌏 Overseas</span>';document.getElementById('modalPlayerBadges').innerHTML=b||'<span class="modal-badge">Player</span>';let s=p.stats||{};if(typeof s==='string')try{s=JSON.parse(s)}catch(e){s={}}let h='<div class="player-details-grid"><div class="details-section"><h4>Info</h4>';if(p.age)h+=`<div class="detail-item"><div class="detail-label">Age</div><div class="detail-value">${p.age}</div></div>`;if(p.nationality)h+=`<div class="detail-item"><div class="detail-label">Nationality</div><div class="detail-value">${p.nationality}</div></div>`;if(p.jersey)h+=`<div class="detail-item"><div class="detail-label">Jersey</div><div class="detail-value">${p.jersey}</div></div>`;h+='</div>';if(Object.keys(s).length>0){h+='<div class="details-section"><h4>Batting</h4><div class="stats-grid">';h+=`<div class="stat-item"><div class="stat-number">${s.matches||0}</div><div class="stat-label">Matches</div></div>`;h+=`<div class="stat-item"><div class="stat-number">${s.runs||0}</div><div class="stat-label">Runs</div></div>`;h+=`<div class="stat-item"><div class="stat-number">${s.battingAvg||'0.00'}</div><div class="stat-label">Avg</div></div>`;h+='</div></div>'}else{h+='<div class="details-section"><div class="empty-state"><h4>No stats</h4></div></div>'}h+='</div>';d.innerHTML=h;m.classList.add('active');document.body.style.overflow='hidden';const c=document.querySelector('.container'),hd=document.querySelector('.team-header');if(c)c.classList.add('blurred');if(hd)hd.classList.add('blurred');console.log('✅ Modal opened:',p.name)}
    function closeModal(){const m=document.getElementById('playerModal');if(m)m.classList.remove('active');document.body.style.overflow='auto';const c=document.querySelector('.container'),hd=document.querySelector('.team-header');if(c)c.classList.remove('blurred');if(hd)hd.classList.remove('blurred')}
    document.getElementById('modalCloseButton').onclick=closeModal;document.getElementById('playerModal').onclick=e=>{if(e.target.id==='playerModal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    async function loadPlayers(){const pc=document.getElementById('playersContainer');pc.innerHTML='<div style="text-align:center;padding:3rem;color:rgba(255,255,255,0.7)">Loading...</div>';try{const r=await fetch(window.location.origin+'/api/admin/players?team=RCB');const data=await r.json();const players=(data.data||data||[]).map(p=>({name:p.name,team:'RCB',role:p.role||'Player',age:p.age,nationality:p.nationality,isForeign:p.isForeign,isCaptain:p.isCaptain,isViceCaptain:p.isViceCaptain,jersey:p.jersey||p.number,stats:typeof p.stats==='string'?JSON.parse(p.stats):p.stats||{}}));document.getElementById('playerCount').textContent=players.length;document.getElementById('foreignCount').textContent=players.filter(p=>p.isForeign).length;document.getElementById('indianCount').textContent=players.filter(p=>!p.isForeign).length;pc.innerHTML='';players.forEach(p=>{const card=document.createElement('div');card.className='player-card';card.innerHTML=`<div class="player-image"><img src="ipl2020/assets/rcb_logo_new.svg" alt="${p.name}"></div><h3 class="player-name">${p.name}</h3><p class="player-role">${p.role}</p><div class="player-badges">${p.isCaptain?'<span class="badge badge-captain">👑 Captain</span>':''}${p.isViceCaptain?'<span class="badge">⭐ VC</span>':''}${p.isForeign?'<span class="badge badge-foreign">🌏 Overseas</span>':''}</div>`;card.style.cursor='pointer';card.onclick=()=>showModal(p);pc.appendChild(card)});console.log('✅ Loaded',players.length,'players')}catch(e){console.error('❌',e);pc.innerHTML='<div style="text-align:center;padding:3rem;color:rgba(255,255,255,0.7)">Error loading players</div>'}}
    loadPlayers();
    </script>
</body>
</html>
