<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kolkata Knight Riders - IPL 2026 | Complete Squad & Player Stats</title>
    <meta name="description" content="Explore Kolkata Knight Riders (KKR) complete squad for IPL 2026. View player profiles, statistics, and team information.">
    <link rel="shortcut icon" href="assets/ipl_logo_new.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared-modern.css">
    <link rel="stylesheet" href="css/team-modern.css">
    <style>
        :root {
            --team-primary: #3A225D;
            --team-secondary: #704C9A;
            --team-accent: #B8860B;
        }
        
        .team-logo-glow {
            background: linear-gradient(135deg, var(--team-primary), var(--team-accent));
        }
        
        .team-stat-card:hover {
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(58, 34, 93, 0.3);
        }
        
        .player-card-modern:hover {
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(58, 34, 93, 0.4),
                inset 0 0 30px rgba(58, 34, 93, 0.2);
        }
    </style>
</head>
<body data-team="KKR">
    <div class="team-background"></div>
    <nav class="team-nav" id="teamNav">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">
                <img src="assets/ipl_logo_new.svg" alt="IPL">
                <span>IPL 2026</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="fixtures_modern.html">Fixtures</a></li>
                <li><a href="points_modern.html">Points</a></li>
                <li><a href="scores_modern.html">Scores</a></li>
            </ul>
        </div>
    </nav>
    <section class="team-hero">
        <div class="team-hero-container">
            <div class="team-logo-wrapper">
                <div class="team-logo-glow"></div>
                <div class="team-logo-circle">
                    <img src="assets/kkr_logo_new.svg" alt="Kolkata Knight Riders">
                </div>
            </div>
            <h1 class="team-title">KOLKATA KNIGHT RIDERS</h1>
            <p class="team-subtitle">Kolkata • Eden Gardens</p>
            <div class="team-stats-grid">
                <div class="team-stat-card">
                    <div class="team-stat-number" id="playerCount">0</div>
                    <div class="team-stat-label">Total Players</div>
                </div>
                <div class="team-stat-card">
                    <div class="team-stat-number" id="foreignCount">0</div>
                    <div class="team-stat-label">Overseas</div>
                </div>
                <div class="team-stat-card">
                    <div class="team-stat-number" id="indianCount">0</div>
                    <div class="team-stat-label">Indian</div>
                </div>
            </div>
        </div>
    </section>
    <section class="squad-section">
        <div class="section-container">
            <div class="section-header">
                <h2 class="section-title">SQUAD 2026</h2>
                <p class="section-subtitle">Meet the knights of Kolkata Knight Riders</p>
            </div>
            <div class="players-grid" id="playersContainer">
                <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 1rem; color: var(--text-muted);">Loading squad...</p>
                </div>
            </div>
        </div>
    </section>
    <div class="player-modal" id="playerModal">
        <div class="player-modal-backdrop"></div>
        <div class="player-modal-content">
            <button class="modal-close" id="modalCloseButton">&times;</button>
            <div class="modal-player-header">
                <div class="modal-player-logo">
                    <img src="assets/kkr_logo_new.svg" alt="Player" id="modalPlayerLogo">
                </div>
                <h2 class="modal-player-name" id="modalPlayerName"></h2>
                <p class="modal-player-role" id="modalPlayerRole"></p>
                <div class="modal-player-badges" id="modalPlayerBadges"></div>
            </div>
            <div class="modal-player-details" id="modalPlayerDetails"></div>
        </div>
    </div>
    <footer class="team-footer">
        <div class="footer-content">
            <p>&copy; 2026 SportsUP99. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/player-modal.js"></script>
    <script src="js/team-page-loader.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('teamNav');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
        document.getElementById('playerModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('player-modal-backdrop')) {
                if (typeof window.closePlayerModal === 'function') {
                    window.closePlayerModal();
                }
            }
        });
    </script>
</body>
</html>
