name = "player-storage-r2"
main = "./cloudflare/worker-r2.ts"
type = "javascript"
account_id = "YOUR_ACCOUNT_ID"
workers_dev = true
compatibility_date = "2025-11-11"

# R2 bucket binding for player storage
[[r2_buckets]]
binding = "PLAYER_BUCKET"
bucket_name = "player-uploads"

# Optional: production route
# route = "https://example.com/api/*"
# zone_id = "YOUR_ZONE_ID"
